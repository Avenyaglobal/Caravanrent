name: price-digest
on:
  schedule:
    # 05:15, 06:15, 07:15, 08:15 and 15:15 Madrid in winter.
    # The first finished run writes the letter. A late GitHub start still writes it.
    - cron: "15 4,5,6,7,14 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/price-digest-send.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store-url.txt data/digest-day.txt data/digest-letter.txt public/price-letter.txt
          git diff --cached --quiet || git commit -m "Send the daily price views"
          git push
