name: price-digest
on:
  schedule:
    # Extra pushes through the day. The site sends only one letter.
    - cron: "15 7,8,9,10,12,15,18 * * *"
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the site to send the morning letter
        run: curl -sS --max-time 45 -w "\n" https://www.caravanrent-alicante.com/api/price-digest
