name: price-digest
on:
  schedule:
    # 08:15, 09:15 and 10:15 Madrid. A failed read is retried by the next run.
    - cron: "15 6,7,8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/price-digest-send.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store-url.txt data/digest-day.txt data/digest-letter.txt public/price-letter.txt
          git diff --cached --quiet || git commit -m "Send the daily price views"
          git push
