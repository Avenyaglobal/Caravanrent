name: price-digest
on:
  schedule:
    # 08:40 Madrid: 06:40 UTC in summer, 07:40 UTC in winter. The script sends only at 08:xx.
    - cron: "40 6,7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/price-digest-send.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/store-url.txt data/digest-day.txt data/digest-letter.txt
          git diff --cached --quiet || git commit -m "Send the daily price views"
          git push
